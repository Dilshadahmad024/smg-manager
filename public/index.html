<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SMG Manager</title>
    <meta name="description" content="SMG Manager - Gym Management & Administration System" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Standalone Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SMG Manager" />
    <meta name="application-name" content="SMG Manager" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/jpeg" href="/icon-192.jpg" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.jpg" />
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('SMG Manager PWA ServiceWorker registered with scope:', reg.scope);
          }).catch((err) => {
            console.warn('PWA ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
